<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice INV-VJ41XY2L</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    @page {
      size: 58mm auto;
      margin: 0;
    }
    body {
      font-family: 'Courier New', monospace;
      width: 58mm;
      padding: 5mm;
      color: #000;
      font-size: 10px;
      line-height: 1.3;
    }
    .header {
      text-align: center;
      margin-bottom: 8px;
      border-bottom: 1px dashed #000;
      padding-bottom: 8px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .header p {
      font-size: 9px;
    }
    .invoice-info {
      margin-bottom: 8px;
      font-size: 9px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .info-label {
      font-weight: bold;
    }
    .kasir-info {
      margin-bottom: 8px;
      font-size: 9px;
      font-weight: bold;
    }
    .items-section {
      margin-bottom: 8px;
      border-top: 1px dashed #000;
      border-bottom: 1px dashed #000;
      padding: 6px 0;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 9px;
    }
    .item-name {
      flex: 1;
      margin-right: 4px;
      word-break: break-word;
    }
    .item-details {
      text-align: right;
      white-space: nowrap;
      font-size: 8px;
    }
    .item-qty-price {
      display: block;
    }
    .item-subtotal {
      display: block;
      font-weight: bold;
      margin-top: 2px;
    }
    .total-section {
      margin-top: 8px;
      border-top: 1px dashed #000;
      padding-top: 8px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .total-final {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #000;
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 8px;
      border-top: 1px dashed #000;
      padding-top: 8px;
    }
    .divider {
      border-top: 1px dashed #000;
      margin: 6px 0;
    }
    @media print {
      body {
        padding: 5mm;
        margin: 0;
      }
      .no-print {
        display: none;
      }
      @page {
        size: 58mm auto;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>INVOICE</h1>
    <p>Warehouse Management System</p>
  </div>

  <div class="invoice-info">
    <div class="info-row">
      <span class="info-label">No:</span>
      <span>INV-VJ41XY2L</span>
    </div>
    <div class="info-row">
      <span class="info-label">Tanggal:</span>
      <span>23 Des 2025, 00.35</span>
    </div>
    <div class="info-row">
      <span class="info-label">Bayar:</span>
      <span>Kartu Debit</span>
    </div>
  </div>

  
    <div class="kasir-info">
      Kasir: admin
    </div>
  

  <div class="divider"></div>

  <div class="items-section">
    
      <div class="item-row">
        <div class="item-name">Corrupti id ut ven</div>
        <div class="item-details">
          <span class="item-qty-price">2 x Rp 40.000</span>
          <span class="item-subtotal">Rp 80.000</span>
        </div>
      </div>
    
  </div>

  <div class="divider"></div>

  <div class="total-section">
    <div class="total-row">
      <span>TOTAL:</span>
      <span>Rp 80.000</span>
    </div>
    <div class="total-final">
      Rp 80.000
    </div>
  </div>

  <div class="footer">
    <p>Terima kasih</p>
    <p>Barang yang sudah dibeli</p>
    <p>tidak dapat ditukar/dikembalikan</p>
  </div>
</body>
</html>
